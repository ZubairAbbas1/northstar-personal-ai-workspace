<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Northstar Personal AI Workspace product preview</title>
  <desc id="desc">A synthetic preview of the Northstar assistant workspace with navigation, priority cards, and an AI chat panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f7ff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7766ee"/><stop offset="1" stop-color="#4c3fbf"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1b1b2f" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="190" height="764" rx="20" fill="#17172c"/>
  <circle cx="72" cy="76" r="22" fill="url(#accent)"/><path d="M64 76h16M72 68v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="108" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Northstar</text>
  <text x="58" y="148" fill="#9998b5" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORKSPACE</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#d9d8ee">
    <rect x="44" y="174" width="158" height="44" rx="12" fill="#29284b"/><text x="72" y="202">Overview</text>
    <text x="72" y="256">Inbox</text><text x="72" y="310">Tasks</text><text x="72" y="364">Calendar</text><text x="72" y="418">GitHub &amp; tools</text>
  </g>
  <text x="58" y="500" fill="#9998b5" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">INTELLIGENCE</text>
  <rect x="44" y="526" width="158" height="44" rx="12" fill="#5b4dd1"/><text x="72" y="554" fill="#fff" font-family="Arial, sans-serif" font-size="15">Assistant</text>
  <text x="72" y="608" fill="#d9d8ee" font-family="Arial, sans-serif" font-size="15">Search</text>
  <text x="58" y="744" fill="#9998b5" font-family="Arial, sans-serif" font-size="13">Self-hosted • Private</text>
  <g font-family="Arial, sans-serif">
    <text x="262" y="88" fill="#7b79a0" font-size="13" font-weight="700" letter-spacing="2">COMMAND DECK</text>
    <text x="262" y="132" fill="#17172c" font-size="32" font-weight="700">Your work, with a clear next step.</text>
    <text x="262" y="164" fill="#676681" font-size="16">A calm personal AI workspace for priorities, inbox, schedule, and connected tools.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="262" y="206" width="540" height="230" rx="22" fill="#fff"/>
    <text x="294" y="246" fill="#17172c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Top priority</text>
    <rect x="294" y="270" width="90" height="28" rx="14" fill="#eeedfe"/><text x="312" y="289" fill="#594bd0" font-family="Arial, sans-serif" font-size="12" font-weight="700">91 / 100</text>
    <text x="294" y="338" fill="#17172c" font-family="Arial, sans-serif" font-size="23" font-weight="700">Review the launch checklist</text>
    <text x="294" y="370" fill="#73718d" font-family="Arial, sans-serif" font-size="14">Urgency, deadline, and available focus time combined.</text>
    <rect x="294" y="394" width="166" height="12" rx="6" fill="#dedcfb"/><rect x="294" y="394" width="136" height="12" rx="6" fill="url(#accent)"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="830" y="206" width="348" height="230" rx="22" fill="#fff"/>
    <text x="862" y="246" fill="#17172c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Today at a glance</text>
    <circle cx="873" cy="286" r="6" fill="#00b894"/><text x="892" y="291" fill="#5f5d79" font-family="Arial, sans-serif" font-size="14">3 focused tasks</text>
    <circle cx="873" cy="326" r="6" fill="#7766ee"/><text x="892" y="331" fill="#5f5d79" font-family="Arial, sans-serif" font-size="14">2 meetings scheduled</text>
    <circle cx="873" cy="366" r="6" fill="#ffb84d"/><text x="892" y="371" fill="#5f5d79" font-family="Arial, sans-serif" font-size="14">1 follow-up to review</text>
    <rect x="862" y="396" width="112" height="22" rx="11" fill="#f3f2ff"/><text x="881" y="411" fill="#5b4dd1" font-family="Arial, sans-serif" font-size="11" font-weight="700">LIVE CONTEXT</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="262" y="478" width="916" height="270" rx="22" fill="#fff"/>
    <rect x="294" y="512" width="38" height="38" rx="12" fill="url(#accent)"/><path d="M306 531h14M313 524v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="348" y="532" fill="#17172c" font-family="Arial, sans-serif" font-size="17" font-weight="700">Northstar Assistant</text>
    <text x="348" y="552" fill="#00a884" font-family="Arial, sans-serif" font-size="12">Grounded in your account</text>
    <rect x="294" y="580" width="630" height="62" rx="16" fill="#f7f8fc"/><text x="318" y="618" fill="#4e4c68" font-family="Arial, sans-serif" font-size="15">Ask about priorities, meetings, inbox, GitHub, or saved memory.</text>
    <rect x="294" y="670" width="820" height="46" rx="14" fill="#fbfbff" stroke="#dedcfb"/><text x="318" y="699" fill="#9a98b5" font-family="Arial, sans-serif" font-size="14">Ask about your work…</text><circle cx="1080" cy="693" r="18" fill="#b4aaf7"/><path d="M1073 693h13m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
